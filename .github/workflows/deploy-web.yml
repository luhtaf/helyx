# Helyx web — fan-out CI (independent of backend; path-filtered).
# Build+push GHCR, then bump helyx/web-deployment.yaml in the manifest
# repo. Same "Image Version Flow" as deploy-backend, separate pipeline.
name: deploy-web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-web
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/huntingyuk/helyx-web
  MANIFEST_REPO: HuntingYuk/k3s-manifest
  MANIFEST_PATH: projects/helyx-web/deployment.yaml

jobs:
  build-push-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive version tag
        id: ver
        run: echo "tag=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump image tag in manifest repo
        env:
          MANIFEST_REPO_TOKEN: ${{ secrets.MANIFEST_REPO_TOKEN }}
        run: |
          set -eu
          git clone --depth 1 \
            "https://x-access-token:${MANIFEST_REPO_TOKEN}@github.com/${MANIFEST_REPO}.git" mrepo
          cd mrepo
          sed -i -E "s#(${IMAGE}):[^\"[:space:]]+#\1:${{ steps.ver.outputs.tag }}#g" "${MANIFEST_PATH}"
          if git diff --quiet; then echo "no image change"; exit 0; fi
          git config user.name  "helyx-ci"
          git config user.email "ci@helyx.local"
          git add "${MANIFEST_PATH}"
          git commit -m "ci(web): helyx-web → ${{ steps.ver.outputs.tag }}"
          git push
