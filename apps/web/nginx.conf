# Helyx web — SPA + same-origin reverse proxy to the backend Service.
# The browser only ever calls app.th; nginx forwards the API + auth +
# OIDC + health paths to helyx-backend:4000 inside the cluster. This
# keeps the SameSite=Strict cookie + CSRF auth flow intact (it cannot
# work cross-host app.th ↔ api-app.th). api-app.th is a separate
# Ingress for direct API consumers, not used by this SPA.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 25m;          # SBOM / bulk-IOC uploads

  location = /health {
    proxy_pass http://helyx-backend:4000;
  }

  location /graphql {
    proxy_pass http://helyx-backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # OIDC SSO top-level redirects (start/callback/status) — see CLAUDE.md
  location /auth/ {
    proxy_pass http://helyx-backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA history-mode fallback; hashed assets cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
